<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1; url=https://locaaqui.github.io/Pizza10/">
  <title>Pizza 10 Itatiba — Apresentação & Demonstração</title>
  <meta name="description" content="Redirecionando para a demonstração oficial do projeto Pizza 10 Itatiba.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0c;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(229, 57, 53, 0.25) 0%, rgba(255, 111, 0, 0.12) 40%, transparent 70%);
      filter: blur(80px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      to { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    .presentation-card {
      position: relative;
      z-index: 1;
      background: rgba(18, 16, 24, 0.85);
      border: 1px solid rgba(255, 111, 0, 0.3);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(229, 57, 53, 0.2), rgba(255, 111, 0, 0.2));
      border: 1px solid rgba(255, 111, 0, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 30px rgba(255, 111, 0, 0.3);
      animation: bounceLogo 2.5s ease-in-out infinite;
    }

    @keyframes bounceLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 30%, #ff8f00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-sub {
      display: inline-block;
      color: #ffd54f;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .status-text {
      font-size: 14px;
      color: #8e8e93;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Loader Spinner */
    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ff6f00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-direct-access {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #e53935, #ff6f00);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(229, 57, 53, 0.4);
      transition: all 0.25s ease;
    }

    .btn-direct-access:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(229, 57, 53, 0.6);
      color: #fff;
    }

    .footer-note {
      font-size: 12px;
      color: #636366;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="presentation-card">
    <div class="logo-container">
      🍕
    </div>
    
    <h1>Pizza 10 Itatiba</h1>
    <span class="badge-sub"><i class="fas fa-fire"></i> Demonstração Oficial do Projeto</span>

    <div class="loader-spinner"></div>
    <p class="status-text" id="statusMsg">
      Redirecionando para a landing page oficial da Pizza 10…
    </p>

    <a href="https://locaaqui.github.io/Pizza10/" class="btn-direct-access" id="redirectLink">
      <i class="fas fa-external-link-alt"></i> Acessar Projeto Agora
    </a>

    <p class="footer-note">
      Locaki &bull; Apresentação para Cliente
    </p>
  </div>

  <script>
    // Support custom subpages via URL query parameter (e.g. ?page=cardapio.html)
    const urlParams = new URLSearchParams(window.location.search);
    const subpage = urlParams.get('page') || '';
    const baseUrl = 'https://locaaqui.github.io/Pizza10/';
    const targetUrl = subpage ? baseUrl + subpage : baseUrl;

    document.getElementById('redirectLink').href = targetUrl;

    // Automatic redirection
    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 600);
  </script>

</body>
</html>
